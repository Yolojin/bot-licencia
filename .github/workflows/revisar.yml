name: Revisar agenda licencia

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar mensaje a Telegram aunque no haya fechas"
        type: boolean
        default: true

concurrency:
  group: revisar-agenda
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Revisar agenda
        env:
          RUT: ${{ secrets.RUT }}
          CLAVE: ${{ secrets.CLAVE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
        run: python revisar_agenda.py
